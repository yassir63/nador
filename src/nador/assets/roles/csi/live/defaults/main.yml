# Defaults of the live view, taken from 5g_ansible roles/5g/csi_logging/defaults/main.yml (1b5a0b30).
# nador.csi.CsiLiveView passes the deployment-specific values (gNB node, address, file).
csi_live_action: start
# The play runs on the live host
csi_live_host: "{{ inventory_hostname }}"
csi_ran_host: ""
csi_live_ran_address: ""
csi_live_ran_user: root
csi_output_dir: /data/csi
csi_file_name: csi_per_rb.csv
# Optional housekeeping CPUs on the gNB node side; never CPUs of the isolated (isolcpus) range
csi_cpu_list: ""
csi_live_dir: /root/csi_live
# Python venv of the viewer (may be shared by the views of several components)
csi_live_venv: "{{ csi_live_dir }}/venv"
# Forced command of the live key on the gNB node
csi_live_source_script: /usr/local/bin/csi_live_source.sh
csi_live_key_comment: "csi-live@{{ csi_live_host }}"
# Streamlit, bound to 127.0.0.1 on the live host (reach it with an ssh tunnel)
csi_live_port: 8501
csi_live_window_s: 120
csi_live_refresh_s: 10
# The local copy on the live host is restarted from "now" beyond this size
csi_live_max_mb: 1024
# Visualizer: a local file on the controller, else downloaded from the oai-csi-logging repository
csi_live_visualizer_src: ""
csi_live_visualizer_ref: csi-v3.1     # the visualizer v9.0 is not on main yet
csi_live_visualizer_url: >-
  https://raw.githubusercontent.com/turletti/oai-csi-logging/{{ csi_live_visualizer_ref }}/visualizer/streamlit_csi_visualizer_v9.0.py
csi_live_pip_packages:
  - streamlit>=1.40
  - pandas>=2.0
  - numpy>=1.26
  - matplotlib>=3.8
  - scipy>=1.11
# stop: also remove the local copy on the live host
csi_live_cleanup: true
