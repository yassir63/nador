apiVersion: v1
kind: ConfigMap
metadata:
  name: nador-one-way
data:
  settings.json: {{ .Values.oneWay | toJson | quote }}
  targets.json: {{ .Values.packetTargets | toJson | quote }}
  reconcile.py: |
{{ .Files.Get "files/reconcile.py" | indent 4 }}
---
{{ $existing := lookup "v1" "Secret" .Release.Namespace "nador-one-way-token" -}}
apiVersion: v1
kind: Secret
metadata:
  name: nador-one-way-token
stringData:
  token: {{ if $existing }}{{ index $existing.data "token" | b64dec | quote }}{{ else }}{{ randAlphaNum 64 | sha256sum | quote }}{{ end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nador-one-way
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nador-one-way
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [nador-one-way]
    verbs: [get]
---
{{- $ns := .Release.Namespace }}
{{- $namespaces := list $ns }}
{{- range .Values.packetTargets }}
{{- $namespaces = append $namespaces .namespace }}
{{- end }}
{{- range ($namespaces | uniq) }}
{{- if ne . $ns }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $ns }}-one-way-read
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $ns }}-one-way
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ if eq . $ns }}nador-one-way{{ else }}{{ $ns }}-one-way-read{{ end }}
subjects:
  - kind: ServiceAccount
    name: nador-one-way
    namespace: {{ $ns }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: nador-one-way-collector
spec:
  selector:
    nador-one-way-role: collector
  ports:
    - name: observations
      port: 55393
    - name: clock
      port: 55393
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nador-one-way
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: nador-one-way}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nador-one-way}
      annotations:
        checksum/code: {{ .Files.Get "files/reconcile.py" | sha256sum }}
    spec:
      serviceAccountName: nador-one-way
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      tolerations: {{ .Values.tolerations | toJson }}
      containers:
        - name: controller
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python3, /config/reconcile.py]
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: nador-one-way}
