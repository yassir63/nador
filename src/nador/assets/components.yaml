defaults:
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: test-eviction
    operator: Equal
    value: 'true'
    effect: NoSchedule
components:
  extended-probes:
    pod_selector:
    - app.kubernetes.io/part-of=nador-extended
  integration:
    release_name: monitoring-integration
    chart_ref: monitoring-integration
    pod_selector: []
  prometheus:
    release_name: monitoring-prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    pod_selector:
    - app.kubernetes.io/name=prometheus
    image:
      repository: quay.io/prometheus/prometheus
      image_tag: v2.47.1
      image_pull_policy: IfNotPresent
    chart_version: 51.9.4
  loki:
    release_name: monitoring-loki
    chart_ref: grafana/loki
    chart_version: 2.16.0
    pod_selector:
    - app=loki
    - release=monitoring-loki
    image:
      repository: grafana/loki
      image_tag: 2.6.1
      image_pull_policy: IfNotPresent
  promtail:
    release_name: monitoring-promtail
    chart_ref: grafana/promtail
    chart_version: 6.17.0
    pod_selector:
    - app.kubernetes.io/name=promtail
    - app.kubernetes.io/instance=monitoring-promtail
    image:
      repository: docker.io/grafana/promtail
      image_tag: 3.5.1
      image_pull_policy: IfNotPresent
    tolerations:
    - operator: Exists
  grafana:
    release_name: monitoring-grafana
    chart_ref: grafana/grafana
    pod_selector:
    - app.kubernetes.io/name=grafana
    - app.kubernetes.io/instance=monitoring-grafana
    image:
      repository: docker.io/grafana/grafana
      image_tag: 11.3.0
      image_pull_policy: IfNotPresent
    chart_version: 8.6.0
  redis:
    image:
      repository: redis
      image_tag: '7'
      image_pull_policy: IfNotPresent
  ue-mapper-api: {}
  packet-pairer: {}
  kpi-calculator-open5gs:
    chart_ref: kpi-calculator
    image:
      repository: ghcr.io/ziyad-mabrouk/kpi-calculator-open5gs
      image_tag: v1.0.0-standard
      image_pull_policy: IfNotPresent
  kpi-calculator-oai:
    chart_ref: kpi-calculator
  ocudu-metrics:
    pod_selector:
    - app.kubernetes.io/part-of=ocudu-metrics
    image:
      repository: ghcr.io/ziyad-mabrouk/telegraf
      image_tag: v1.0@sha256:ae262668bab56106cef1aae3e10ed345878749b1977d7fc48f34a5e58ce646f5
      image_pull_policy: IfNotPresent
  monitoring-controller:
    pod_selector:
    - app.kubernetes.io/instance=monitoring-controller
  one-way:
    pod_selector:
    - app.kubernetes.io/name=nador-one-way
